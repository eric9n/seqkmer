[package]
name = "seqkmer"
version = "0.1.5"
edition = "2021"
authors = ["eric9n@gmail.com"]
description = "High-performance FASTA/FASTQ IO and minimizer-based k-mer analysis utilities for Rust bioinformatics pipelines."
license = "MIT"
repository = "https://github.com/eric9n/seqkmer"
keywords = ["bioinformatics", "sequence", "kmer", "dna", "genomics"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossbeam-channel = "0.5"
scoped_threadpool = "0.1.9"
flate2 = "1.0"

[features]
default = ["dna"]
dna = []
protein = []
